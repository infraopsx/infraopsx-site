name: CI

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  docker-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build builder image
        run: docker build --target builder -t infraopsx-site:builder .

      - name: Verify Ceph capacity model
        run: docker run --rm infraopsx-site:builder npm run test:ceph

      - name: Build Docker image
        run: docker build -t infraopsx-site:ci .

      - name: Validate Nginx configuration
        run: docker run --rm infraopsx-site:ci nginx -t

      - name: Start production image for E2E
        run: |
          docker run -d             --name infraopsx-e2e             -p 8080:80             infraopsx-site:ci

          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/healthz >/dev/null; then
              exit 0
            fi
            sleep 1
          done

          docker logs infraopsx-e2e
          exit 1

      - name: Run Playwright E2E
        run: |
          docker run --rm             --network host             -e CI=true             -e BASE_URL=http://127.0.0.1:8080             -v "$PWD:/work"             -w /work/site             mcr.microsoft.com/playwright:v1.55.0-noble             sh -lc 'npm install --ignore-scripts && npm run test:e2e'

      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            site/playwright-report
            site/test-results
          if-no-files-found: ignore
          retention-days: 7

      - name: Show site logs on failure
        if: failure()
        run: docker logs infraopsx-e2e || true

      - name: Stop E2E site
        if: always()
        run: docker rm -f infraopsx-e2e || true
