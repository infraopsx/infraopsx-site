services:
  website:
    image: ghcr.io/infraopsx/infraopsx-site:${IMAGE_TAG:-latest}

    container_name: infraopsx
    restart: unless-stopped

    expose:
      - "80"

    networks:
      - edge

    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/healthz | grep -qx 'ok'"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  edge:
    external: true
    name: edge
