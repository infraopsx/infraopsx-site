name: Deploy Production

on:
  workflow_run:
    workflows:
      - "Publish Docker Image"
    types:
      - completed

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Netcup
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest

    steps:
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          printf '%s\n' "${{ secrets.VPS_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy image and verify
        env:
          FULL_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          NEW_TAG="${FULL_SHA:0:7}"

          echo "Deploying image tag: ${NEW_TAG}"

          ssh \
            -i ~/.ssh/deploy_key \
            -p "${{ secrets.VPS_PORT }}" \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            "NEW_TAG='${NEW_TAG}' sh -s" <<'REMOTE'
          set -u

          cd /opt/compose/infraopsx

          IMAGE="ghcr.io/infraopsx/infraopsx-site:${NEW_TAG}"

          OLD_TAG="$(sed -n 's/^IMAGE_TAG=//p' .env | tail -n 1)"

          if [ -z "${OLD_TAG}" ]; then
            echo "ERROR: Current IMAGE_TAG not found."
            exit 1
          fi

          echo "Current tag: ${OLD_TAG}"
          echo "New tag:     ${NEW_TAG}"

          echo "Validating production docker-compose.yml..."

          if ! IMAGE_TAG="${OLD_TAG}" docker compose config -q; then
            echo "ERROR: Production docker-compose.yml is invalid."
            exit 1
          fi

          if ! docker network inspect edge >/dev/null 2>&1; then
            echo "ERROR: Required external Docker network 'edge' does not exist."
            exit 1
          fi

          echo "Pulling ${IMAGE}..."

          if ! docker pull "${IMAGE}"; then
            echo "ERROR: Unable to pull ${IMAGE}."
            exit 1
          fi

          rollback() {
            echo "Rolling back to ${OLD_TAG}..."

            printf 'IMAGE_TAG=%s\n' "${OLD_TAG}" > .env

            docker compose pull || true

            if docker compose up -d --wait --wait-timeout 60; then
              if docker compose exec -T website \
                wget -qO- http://127.0.0.1/healthz | grep -qx 'ok'; then

                echo "Rollback successful. Production restored to ${OLD_TAG}."
              else
                echo "ERROR: Rollback container is healthy but /healthz failed."
                docker compose ps || true
                docker logs --tail 100 infraopsx || true
              fi
            else
              echo "ERROR: Rollback failed."
              docker compose ps || true
              docker logs --tail 100 infraopsx || true
            fi

            exit 1
          }

          printf 'IMAGE_TAG=%s\n' "${NEW_TAG}" > .env

          echo "Starting ${NEW_TAG}..."

          if ! docker compose up -d --wait --wait-timeout 60; then
            echo "ERROR: Container did not become healthy."
            rollback
          fi

          echo "Checking internal site health..."

          if ! docker compose exec -T website \
            wget -qO- http://127.0.0.1/healthz | grep -qx 'ok'; then

            echo "ERROR: Internal health check failed."
            rollback
          fi

          echo "Deployment successful: ${NEW_TAG}"

          docker compose ps
          REMOTE
